name: Build TrajCompare.exe

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check project files
        shell: pwsh
        run: |
          foreach ($f in 'trajcompare.py','trajcompare_gui.py','requirements.txt') {
            if (-not (Test-Path $f)) {
              Write-Error "Нет файла $f в корне репозитория. Загрузите файлы из архива TrajCompare_build.zip в корень (не во вложенную папку)."
              exit 1
            }
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name TrajCompare
          --hidden-import mpl_toolkits.mplot3d
          --exclude-module scipy --exclude-module IPython --exclude-module PyQt5 --exclude-module PySide6
          trajcompare_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: TrajCompare-windows
          path: dist/TrajCompare.exe

     
